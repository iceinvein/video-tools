# Netlify Configuration File

[build]
  # Build command using Bun
  command = "bun run build"
  
  # Directory with the static content
  publish = "dist"
  
  # Functions directory (if needed in future)
  # functions = "netlify/functions"

[build.environment]
  # Node version (LTS)
  NODE_VERSION = "22"
  
  # Use Bun for builds
  BUN_VERSION = "1.1.38"

# Redirect rules (also in _redirects file)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers (also in _headers file for redundancy)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Plugin configuration
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  
  # Optional: Lighthouse configuration
  [plugins.inputs]
    output_path = "reports/lighthouse.html"

# Context-specific settings
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  environment = { NODE_ENV = "production" }

# Dev server settings
[dev]
  command = "bun run dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false
